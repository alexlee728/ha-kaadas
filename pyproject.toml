[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "ASYNC"]
ignore = [
    "PLR2004",
    "PLR0913",
    # Home Assistant entities declare _attr_* lists as class attributes.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# pytest injects fixtures as positional arguments.
"tests/**" = ["PLR0917"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
